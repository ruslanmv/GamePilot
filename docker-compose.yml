version: '3.8'

services:
  # GamePilot API Server
  gamepilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamepilot-api
    ports:
      - "8000:8000"
    environment:
      - GAMEPILOT_ENV=production
      - LOG_LEVEL=INFO
      - MAX_ACTIONS_PER_SECOND=10
      - ENABLE_CONTROL=false  # Safety: disabled by default
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - gamepilot-network

  # Redis for caching and rate limiting (optional)
  redis:
    image: redis:7-alpine
    container_name: gamepilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - gamepilot-network
    command: redis-server --appendonly yes

  # Prometheus for metrics (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: gamepilot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - gamepilot-network

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: gamepilot-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - gamepilot-network
    depends_on:
      - prometheus

networks:
  gamepilot-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
